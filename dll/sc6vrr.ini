; sc6vrr.ini - settings for SoulCalibur VI in CrossOver.
; This file sits next to SoulcaliburVI.exe. Text after ";" is a comment.
;
; Who reads which section:
;   [sc6vrr]  The sc6vrr dinput8.dll reads it at every game start, however the
;             game is started (CrossOver GUI, SoulCalibur VI.app, dll/launch.sh,
;             or wine), in SC6-Rosetta and in SC6-FEX.
;   [launch]  Process settings that must exist before the game starts.
;             dll/launch.sh and SoulCalibur VI.app read them at every launch.
;             For CrossOver GUI launches (SC6-Rosetta or SC6-FEX), run
;             dll/apply-ini.sh after you edit this section (dll/launch.sh also
;             runs it). Keys marked "launch.sh only" work only with dll/launch.sh.
;
; An environment variable with the same name as a [sc6vrr] key overrides this
; file. The test scripts in tests/ use that, so their runs stay reproducible.
; The DLL writes the values it used to sc6vrr.log next to the exe.

[sc6vrr]
SC6VRR_FRAME_MODS=0     ; 0 = stock frame timing; every frame hook below stays off. 1 = allow the frame hooks (UNCAP, GATE, MEASURE, FRAME_TIMERS).
SC6VRR_UNCAP=0          ; needs FRAME_MODS=1. 0 = keep the game's 60 fps lock. 1 = remove the lock; SC6VRR_MAX_FPS becomes the limit.
SC6VRR_GATE=0           ; needs FRAME_MODS=1. 0 = the battle advances once per rendered frame (with UNCAP=1 it runs too fast). 1 = the battle advances 60 times per second at any frame rate.
SC6VRR_MAX_FPS=120      ; number, used only with UNCAP=1: the frame-rate limit (for example 120 or 240).
SC6VRR_INPUT_LATCH=0    ; needs GATE=1. 0 = off. 1 = a button that goes down counts as held until the next 60 Hz battle step has read it, so a tap that ends between two steps is not lost. Restart needed.
SC6VRR_EARLY_STEP=0     ; needs GATE=1. 0 = off. 1 = a new button press (not a direction) on a frame without a battle step runs that step one frame early, so the press reaches the battle up to 8.3 ms sooner at 120 fps. The battle still runs 60 steps per second, so frame counts (parry, hitstun, move lengths) do not change. Off online and outside battles. LIVE: F5 toggles it in game; sc6vrr.log logs the per-second counts ("early").
SC6VRR_MEASURE=0        ; needs FRAME_MODS=1. 0 = no measurement. 1 = log battle steps and the time of measured engine functions to sc6vrr.log.
SC6VRR_FRAME_TIMERS=0   ; needs FRAME_MODS=1 and MEASURE=1. 0 = off. 1 = also time the four detailed frame stages (adds a small cost).
SC6VRR_THREAD_NAMES=0   ; 0 = off. 1 = log the names that the game gives its threads (diagnostics).
SC6VRR_OFFLINE_LOGIN=1  ; 0 = the title screen logs in to Bandai Namco's servers after Start (slow; waits on the network). 1 = skip that login: the game starts in offline mode at once (no online features this session).
SC6VRR_SKIP_TITLE=1     ; 0 = wait for a button on the "press any button" title screen. 1 = the DLL presses Start there for you, so the game goes on to the main menu by itself.
SC6VRR_HIDE_DINPUT_PADS=0 ; 0 = the game sees controllers through both XInput and DirectInput. 1 = hide controllers from DirectInput, so they reach the game only through XInput (for a controller that the game reads twice, once through each; non-XInput pads and arcade sticks then stop working). sc6vrr.log lists the controllers DirectInput reports ("dinput:"). Restart needed.
SC6VRR_FAST_IMPORTS=1   ; 0 = the game calls Windows' TlsGetValue, towupper and towlower directly. 1 = it calls x86 copies in the DLL instead. In SC6-FEX, each call into Wine's ARM64 system code costs about 30 ns, and the game makes millions of them (its memory allocator calls TlsGetValue on every allocation): this made the boot about 3 s faster.
SC6VRR_FAST_LOCKS=1     ; 0 = Windows' Enter/Leave/TryEnterCriticalSection. 1 = x86 fast paths in the DLL for locks that are free or already held by the same thread; contended locks still use Wine's code. In SC6-FEX: 60 ns -> 14 ns per lock and unlock (about 100 million of each before the main menu).
SC6VRR_FAST_CRT=1       ; 0 = Windows' memcpy, memmove, memset, GetCurrentThreadId, toupper, _stricmp, _wcsnicmp. 1 = x86 copies in the DLL (copies and fills over 64 bytes and non-ASCII text still use the originals). Saves about 2 s of boot in SC6-FEX.
SC6VRR_COUNT_IMPORTS=0  ; diagnostics. 0 = off. 1 = count every call the game makes to a Windows import (adds a small cost to each call). F9 clears the counts, F8 writes the 40 most-called imports to sc6vrr.log; the counts are also logged at the scene change to the main menu.
SC6VRR_SAMPLE=0         ; 0 = off. 1 = a helper thread samples where the game and render threads spend their time and writes sc6vrr-samples.tsv next to the exe every SC6VRR_SAMPLE_DUMP_SECS seconds. F9 in the game clears the counts. F8 saves the counts so far to sc6vrr-samples.<n>.tsv and keeps counting. Profiling only (small cost).
SC6VRR_SAMPLE_HZ=250    ; number, 10 to 1000, used only with SAMPLE=1: samples per second for each watched thread.
SC6VRR_SAMPLE_ALL=0     ; used only with SAMPLE=1. 0 = watch the game thread and the render threads. 1 = also watch the TaskGraph workers and the async loading thread.
SC6VRR_SAMPLE_DUMP_SECS=10 ; number, used only with SAMPLE=1: seconds between writes of the samples file.
SC6VRR_HDR=0            ; 1 = let the game's HDR renderer run (it normally needs an NVIDIA or AMD GPU). Turn it on in game with bUseHDRDisplayOutput=True in GameUserSettings.ini; HDRDisplayOutputNits below 1500 picks the 1000-nit tone curve, 1500 or more the 2000-nit curve. Needs the SC6 DXMT build. Restart needed.
SC6VRR_BLOCK_QUERY_WAIT=0  ; 0 = the render thread polls the GPU event query in a loop (the game's own code). 1 = it blocks on a Win32 event that DXMT sets when the GPU is done (frees about one CPU core; stops itself if DXMT never signals).
SC6VRR_SKIP_GS_DRAWS=0  ; 0 = draw everything. 1 = drop draws that use a geometry shader (GPU profiling only; the image is incomplete).
SC6VRR_GPU_PASSES=0   ; 0 = off. 1 = time every render pass on the GPU (a new pass whenever the render target texture changes) and write sc6vrr-gpu-passes.tsv next to the exe every 10 seconds (F9 clears the counts) and sc6vrr-gpu-passes-worst.tsv (the 6 slowest frames, pass by pass). 2 = like 1, but a new pass only when the target size or format changes: fewer timestamps, so the game slows less. Profiling only: it slows the game. Needs SC6VRR_SHADER_DIR and the DXMT build with GPU-counter timestamps.
SC6VRR_GPU_FILE=        ; Windows path; empty = sc6vrr-gpu-passes.tsv next to the exe.
SC6VRR_SKIP_PREPASS=0   ; 0 = draw everything. 1 = do not draw the depth prepass (the depth-only pass before the main scene pass); the main pass then writes depth itself. Apple GPUs remove hidden pixels in hardware, so this should save GPU time. Needs SC6VRR_SHADER_DIR. LIVE: F6 toggles it in game, and saving this file applies it within a second (also live: SC6VRR_SKIP_GS_DRAWS, SC6VRR_MAX_FPS). Every other setting needs a game restart.
SC6VRR_PASS_STATS=   ; empty = off. A Windows file path (for example C:\sc6vrr-shaders\dxmt-passes.tsv): the SC6 DXMT fork writes the size and load/store actions of every render pass attachment there, every Nth frame. Needs the SC6 DXMT build. Restart needed.
SC6VRR_PASS_STATS_EVERY=240   ; N for SC6VRR_PASS_STATS (default 240 frames).
SC6VRR_RO_DEPTH_DONTCARE=0   ; needs the SC6 DXMT build. 1 = after a render pass that only reads depth, do not write the depth image back to memory (it cannot have changed). Saves memory traffic. LIVE: F7 toggles it in game. If depth-based effects (fog, shadows, lighting edges) break, set 0.
SC6VRR_SHADER_DIR=      ; Windows path; empty = off. A path = save every shader the game creates there, and F10 logs one frame's draw calls.
SC6VRR_LOG=             ; empty = sc6vrr.log next to the exe. none = no log file. A Windows path = write the log there instead.

[launch]
MetalHUD=1              ; 0 = no overlay. 1 = show Apple's Metal performance HUD (fps, GPU time, memory).
NativeFullscreen=1      ; 0 = DXMT's windowed-style fullscreen. 1 = macOS native fullscreen (its own Space).
Bgr10a2Layer=1          ; 0 = the screen layer uses the game's own pixel format. 1 = 10-bit BGR10A2 layer.
MetalFXUpscale=0        ; 0 = present at the game's resolution. 1 = MetalFX spatial upscaling to the screen by MetalFXUpscaleFactor.
MetalFXUpscaleFactor=2.0 ; number, used only with MetalFXUpscale=1: the upscale factor (2.0 = twice the width and height).
DxmtMaxFrameRate=0      ; number. 0 = DXMT does not pace frames. 60 or 120 = DXMT paces presentation to that rate (ProMotion).
DisplaySync=0           ; 0 = show each frame as soon as it is ready (lowest delay; may tear in direct presentation). 1 = switch frames only between screen refreshes (no tearing; can add delay).
PipelineArchive=0       ; 0 = compile GPU pipelines on first use each run. 1 = save them in a Metal binary archive and load them on later runs (needs a DXMT build with the archive).
NvExt=0                 ; 0 = remove the NVIDIA driver registry keys, so the game sees no NVAPI or DLSS support. 1 = add them.
DumpLayers=1            ; 0 = off. 1 = DXMT logs the window's layer tree (presentation diagnostics).
DxmtLog=1               ; 0 = DXMT writes no log. 1 = DXMT's default logging.
WineLog=1               ; 0 = WINEDEBUG=-all (no Wine debug output). 1 = Wine's default output.
GameModeHelper=1        ; launch.sh only. 0 = no helper. 1 = the crossover-gamemode helper forces Game Mode on while the game runs.
