; Merge this section into the game's user Engine.ini:
;   <bottle>/drive_c/users/crossover/AppData/Local/SoulcaliburVI/Saved/Config/WindowsNoEditor/Engine.ini
; Do not replace that file. It already holds [Core.System] and other sections.
;
; Why [SystemSettings]: UE4 applies these values with "system settings ini" priority,
; which is higher than the scalability groups (sg.*) that the in-game graphics menu
; changes. So the menu cannot turn these effects back on. Device profiles and the
; console still have higher priority; SC6's Windows device profile sets no CVars.
; It is unverified that this shipping build reads the user [SystemSettings] section.
;
; Kept on purpose: bloom, ambient occlusion, auto exposure (r.EyeAdaptationQuality),
; and FXAA. They change the game's look or image quality.

[SystemSettings]
; Motion blur. Off at every quality level. The interpolated 120 fps output already
; shows smooth motion, and blur from the 60 Hz simulation steps would smear it.
r.MotionBlurQuality=0
; Depth of field, including cinematic camera DoF from post-process volumes.
r.DepthOfFieldQuality=0
; Lens flares (image-based flare pass).
r.LensFlareQuality=0
; Chromatic aberration (scene color fringe).
r.SceneColorFringeQuality=0
; Light shafts (god rays) from directional lights.
r.LightShaftQuality=0
; Tonemapper: 1 keeps film contrast but drops vignette (2+) and film grain (3+).
r.Tonemapper.Quality=1
r.Tonemapper.GrainQuantization=0
